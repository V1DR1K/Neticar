  <text x="618" y="277" font-family="Arial,sans-serif" font-size="13" fill="#777469">Proteínas</text><text x="618" y="310" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20211d">96 g</text><rect x="618" y="328" width="122" height="7" rx="4" fill="#ece8df"/><rect x="618" y="328" width="79" height="7" rx="4" fill="#d5a52c"/>
