  <text x="413" y="489" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#292a25">Almuerzo de ejemplo</text><text x="413" y="512" font-family="Arial,sans-serif" font-size="12" fill="#777469">Plato ilustrativo · sin receta médica</text><text x="1040" y="500" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#292a25">640 kcal</text>
