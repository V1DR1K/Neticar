  <text x="302" y="660" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.1" fill="#817b6d">MUESTRA DE PORTFOLIO · NÚMEROS FICTICIOS · SIN CONSEJO NUTRICIONAL</text>
